spring:
  application:
    name: sandox
  datasource:
    url: jdbc:postgresql://localhost:5432/sandox
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

server:
  port: 8080

logging:
  level:
    root: INFO
    dev.arthur: DEBUG
