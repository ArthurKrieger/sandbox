spring:
  application:
    name: sandbox
  datasource:
    url: jdbc:postgresql://localhost:5432/sandbox
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

server:
  port: 8080

logging:
  level:
    root: INFO
    dev.arthur: DEBUG
  pattern:
    # trace_id/span_id are injected into MDC automatically by the OTel Java
    # agent whenever a span is active (no code change needed) — this just
    # prints them, so you can copy a trace_id straight from a CloudWatch log
    # line into Jaeger's search to find the exact request.
    level: "%5p [trace_id=%X{trace_id:-},span_id=%X{span_id:-}]"
