spring:
  application:
    name: sandbox
  datasource:
    url: jdbc:postgresql://localhost:5432/sandbox
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

server:
  port: 8080

logging:
  level:
    root: INFO
    dev.arthur: DEBUG
  # Output format (JSON, via logstash-logback-encoder) lives in
  # logback-spring.xml now — trace_id/span_id show up there as their own
  # fields automatically, no pattern needed.
