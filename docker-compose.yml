# Only the app's supporting infra -- spring-boot-docker-compose auto-starts
# this when the app boots locally (`./gradlew bootRun`), and stops it on
# shutdown. The app itself is NOT a service here: it's what's currently
# starting up and reading this file, so building/running a second copy of
# it as a compose service is circular (and on Windows, actively broke --
# Docker's build context COPY racing the host Gradle daemon for the same
# .gradle cache files under this directory).
services:
  postgres:
    image: postgres:16-alpine
    container_name: sandbox-postgres
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

