# Supporting services only; spring-boot-docker-compose starts them on bootRun.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sandbox-postgres
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node Kafka (KRaft) on localhost:9092, with the image's defaults; the producer sets the tracking topic's
  # retention itself. Run locally, the consumer service uses this one too.
  kafka:
    image: apache/kafka:4.1.0
    container_name: sandbox-kafka
    ports:
      - "9092:9092"

volumes:
  postgres_data:

