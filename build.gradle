plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.arthur'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		// AWS SDK v2's own BOM -- keeps every software.amazon.awssdk:* module
		// (sns, sqs, ...) on matching, compatible versions without pinning each one.
		mavenBom 'software.amazon.awssdk:bom:2.29.0'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Swagger/OpenAPI Documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

	// Structured (JSON) console logging — lets FireLens/Fluent Bit parse each
	// log line straight into separate Elasticsearch fields (level, trace_id,
	// message, etc.) instead of shipping one opaque text blob per line.
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

	// Publishes to SNS. Picks up credentials via the SDK's default chain --
	// the ECS task role in prod (see sandbox-infra's modules/iam
	// sns_topic_arn_publish), your local aws configure/SSO profile when
	// running this on your own machine.
	implementation 'software.amazon.awssdk:sns'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
