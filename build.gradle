plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.arthur'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// Local dev: `sandbox-messaging` published via `./gradlew publishToMavenLocal`
	// in that repo. CI/prod resolve the same coordinates from S3 instead --
	// gated on AWS_ACCESS_KEY_ID because Gradle's AwsCredentials validates
	// eagerly at repo-registration time, so an unconditional block breaks
	// every local build with no AWS env vars set.
	mavenLocal()
	mavenCentral()
	if (System.getenv('AWS_ACCESS_KEY_ID')) {
		maven {
			url = "s3://${System.getenv('MAVEN_S3_BUCKET') ?: 'unset'}/releases"
			credentials(AwsCredentials) {
				accessKey = System.getenv('AWS_ACCESS_KEY_ID')
				secretKey = System.getenv('AWS_SECRET_ACCESS_KEY')
				sessionToken = System.getenv('AWS_SESSION_TOKEN')
			}
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Swagger/OpenAPI Documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

	// Structured (JSON) console logging — lets FireLens/Fluent Bit parse each
	// log line straight into separate Elasticsearch fields (level, trace_id,
	// message, etc.) instead of shipping one opaque text blob per line.
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

	// SNS/SQS wiring shared with sandbox-consumer. 0.1.0-SNAPSHOT while
	// developing against a local build (mavenLocal above); CI/prod pin an
	// actual released version once sandbox-messaging cuts a tag.
	implementation 'dev.arthur:sandbox-messaging:0.1.0-SNAPSHOT'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
