plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.arthur'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// No hardcoded fallback: this project is meant to be recreated in any AWS
// account, and the bucket name is account-specific
// (sandbox-maven-repo-<account_id>, see environments/persistent) -- a
// fallback baked in here would silently point at the wrong bucket the
// moment this runs against a different account.
def mavenS3Bucket = System.getenv('MAVEN_S3_BUCKET')
if (!mavenS3Bucket) {
	throw new GradleException('MAVEN_S3_BUCKET env var not set -- export it (see scripts/load-env)')
}

repositories {
	mavenCentral()
	// Same repo, local and CI: no mavenLocal() shortcut. AwsImAuthentication
	// tells Gradle's S3 transport to use the AWS SDK's own default credential
	// provider chain instead of a hardcoded credentials block -- the same
	// chain the AWS CLI/Terraform already use here (a local ~/.aws profile),
	// and the one CI's OIDC step populates via env vars. One resolution
	// path, whichever credentials happen to be present.
	maven {
		url = "s3://${mavenS3Bucket}/releases"
		authentication {
			awsIm(AwsImAuthentication)
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Swagger/OpenAPI Documentation
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'

	// Structured (JSON) console logging — lets FireLens/Fluent Bit parse each
	// log line straight into separate Elasticsearch fields (level, trace_id,
	// message, etc.) instead of shipping one opaque text blob per line.
	implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

	// SNS/SQS wiring shared with sandbox-consumer -- always the real
	// S3-published release, same version local and CI.
	implementation 'dev.arthur:sandbox-messaging:0.1.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
