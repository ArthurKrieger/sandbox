name: CI/CD - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  CONTAINER_NAME: sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AWS
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        run: |
          set -e
          echo "Cloning repository using GITHUB_TOKEN"
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch --depth=1 origin ${{ github.ref }}
          git checkout -f ${{ github.sha }}

      - name: Verify AWS infra is deployed
        run: |
          ok=true
          check() {
            if [ -z "$2" ]; then
              echo "::error::Missing $1"
              ok=false
            fi
          }
          check "vars.AWS_REGION" "${{ vars.AWS_REGION }}"
          check "vars.AWS_DEPLOY_ROLE_ARN" "${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          check "vars.ECR_REPOSITORY" "${{ vars.ECR_REPOSITORY }}"
          check "vars.ECS_CLUSTER" "${{ vars.ECS_CLUSTER }}"
          check "vars.ECS_SERVICE" "${{ vars.ECS_SERVICE }}"
          check "vars.SPRING_DATASOURCE_URL" "${{ vars.SPRING_DATASOURCE_URL }}"
          check "secrets.ECS_TASK_EXECUTION_ROLE_ARN" "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}"
          check "secrets.DB_USERNAME" "${{ secrets.DB_USERNAME }}"
          check "secrets.DB_PASSWORD" "${{ secrets.DB_PASSWORD }}"
          if [ "$ok" = false ]; then
            echo ""
            echo "One or more required GitHub Environment values (above) are empty."
            echo "This means the AWS infra isn't deployed right now (or was destroyed)."
            echo ""
            echo "Fix: run 'terraform apply -var-file=terraform.tfvars' in"
            echo "sandbox-infra/environments/sandbox first — it creates the AWS resources"
            echo "AND writes all of these values automatically. Then re-run this workflow."
            exit 1
          fi
          echo "All required AWS Environment vars/secrets are present — proceeding."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build -x test

      - name: Upload JAR artifact (to S3 if configured)
        run: |
          set -e
          if [ -n "${{ vars.S3_ARTIFACT_BUCKET }}" ]; then
            echo "Uploading jar to s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/"
            aws s3 cp build/libs/sandbox-*.jar s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/ --region ${{ vars.AWS_REGION }} || true
          else
            echo "S3_ARTIFACT_BUCKET not set; skipping artifact upload."
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build, tag and push Docker image to ECR
        id: push-image
        run: |
          set -e
          REPO=${{ env.ECR_REPOSITORY }}
          IMAGE_TAG=${{ github.sha }}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${REPO}:${IMAGE_TAG}
          aws ecr describe-repositories --repository-names ${REPO} >/dev/null 2>&1 || aws ecr create-repository --repository-name ${REPO} >/dev/null
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          docker build -t ${REPO}:${IMAGE_TAG} .
          docker tag ${REPO}:${IMAGE_TAG} ${ECR_URI}
          docker push ${ECR_URI}
          echo "image=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Register task definition and update service
        id: deploy-cli
        run: |
          set -e
          IMAGE=${{ steps.push-image.outputs.image }}

          # Clone the currently-registered task definition (whatever
          # sandbox-infra's Terraform last shaped it into — env vars,
          # FireLens sidecar, cpu/memory, everything) and swap only the
          # sandbox container's image. This is the ONLY thing CI owns about
          # the task definition; everything else stays defined in Terraform,
          # one place, so it can never drift out of sync with what actually
          # deploys.
          aws ecs describe-task-definition --task-definition ${{ env.ECR_REPOSITORY }} --query 'taskDefinition' > current-taskdef.json

          jq --arg IMAGE "$IMAGE" --arg NAME "${{ env.CONTAINER_NAME }}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' current-taskdef.json > new-taskdef.json

          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=${TASK_DEF_ARN}" >> $GITHUB_OUTPUT

          # Just kicks off the rolling deployment -- doesn't wait for it.
          # ECS's default deployment config (maximumPercent 200%) starts the
          # new task and only stops the old one once the new one is
          # confirmed up, so both run side by side for a bit. The next step
          # deliberately updates DNS during that overlap, not after --
          # otherwise every deploy has a gap where DNS still points at an
          # already-stopped task.
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --task-definition ${TASK_DEF_ARN} --force-new-deployment

      - name: Point FreeDNS hostname at the new task's IP
        if: ${{ vars.FREEDNS_HOSTNAME != '' }}
        run: |
          set -e
          # Polls for the newly-registered task definition's task to be
          # RUNNING *and actually answering HTTP* (ECS's own RUNNING status
          # doesn't mean the JVM inside has finished starting), then updates
          # DNS immediately -- while the previous task is typically still
          # serving traffic, so there's no gap where the hostname points at
          # nothing.
          NEW_IP=""
          for i in $(seq 1 30); do
            TASK_ARNS=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --service-name ${{ env.ECS_SERVICE }} --desired-status RUNNING --query 'taskArns' --output text)
            if [ -n "$TASK_ARNS" ]; then
              NEW_TASK_ARN=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARNS --query "tasks[?taskDefinitionArn=='${{ steps.deploy-cli.outputs.task_def_arn }}'] | [0].taskArn" --output text 2>/dev/null)
              if [ -n "$NEW_TASK_ARN" ] && [ "$NEW_TASK_ARN" != "None" ]; then
                ENI_ID=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks "$NEW_TASK_ARN" --query "tasks[0].attachments[?type=='ElasticNetworkInterface'] | [0].details[?name=='networkInterfaceId'].value | [0]" --output text)
                CANDIDATE_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --query 'NetworkInterfaces[0].Association.PublicIp' --output text 2>/dev/null)
                if [ -n "$CANDIDATE_IP" ] && [ "$CANDIDATE_IP" != "None" ] && curl -sf -m 4 "http://${CANDIDATE_IP}:8080/actuator/health" > /dev/null 2>&1; then
                  NEW_IP="$CANDIDATE_IP"
                  break
                fi
              fi
            fi
            sleep 5
          done

          if [ -z "$NEW_IP" ]; then
            echo "::warning::New task never answered HTTP within the timeout — skipping DNS update, hostname still points at whatever it last did."
            exit 0
          fi

          RESPONSE=$(curl -s "${{ secrets.FREEDNS_UPDATE_URL }}&address=${NEW_IP}")
          echo "FreeDNS response: ${RESPONSE}"
          case "$RESPONSE" in
            "Updated"*|*"has not changed"*) echo "App is now reachable at http://${{ vars.FREEDNS_HOSTNAME }}:8080" ;;
            *) echo "::warning::Unexpected FreeDNS response — hostname may not have updated." ;;
          esac

      - name: Wait for deployment to stabilize
        run: aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}

      - name: Collect CloudWatch logs
        run: |
          mkdir -p logs
          aws logs filter-log-events --log-group-name /ecs/${{ env.ECR_REPOSITORY }} --limit 500 --region ${{ env.AWS_REGION }} --query "events[].message" --output text > logs/ecs-deploy-logs.txt || true
          echo "Saved logs to logs/ecs-deploy-logs.txt"

      - name: Upload CloudWatch logs (to S3 if configured)
        run: |
          set -e
          if [ -n "${{ vars.S3_ARTIFACT_BUCKET }}" ]; then
            aws s3 cp logs/ecs-deploy-logs.txt s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/ecs-deploy-logs.txt --region ${{ vars.AWS_REGION }} || true
            echo "Uploaded logs to s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/ecs-deploy-logs.txt"
          else
            echo "S3_ARTIFACT_BUCKET not set; skipping log upload."
          fi

      - name: Log Docker image info
        run: docker images | grep sandbox || true
