name: CI/CD - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  CONTAINER_NAME: sandox

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AWS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandox-app
          path: build/libs/sandox-*.jar
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build, tag and push Docker image to ECR
        id: push-image
        run: |
          REPO=${{ env.ECR_REPOSITORY }}
          IMAGE_TAG=${{ github.sha }}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${REPO}:${IMAGE_TAG}
          aws ecr describe-repositories --repository-names ${REPO} >/dev/null 2>&1 || aws ecr create-repository --repository-name ${REPO} >/dev/null
          docker build -t ${REPO}:${IMAGE_TAG} .
          docker tag ${REPO}:${IMAGE_TAG} ${ECR_URI}
          docker push ${ECR_URI}
          echo "image=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Create ECS task definition file
        run: |
          mkdir -p ecs
          cat > ecs/taskdef.json <<'TASK'
          {
            "family": "${{ env.ECR_REPOSITORY }}",
            "executionRoleArn": "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}",
            "networkMode": "awsvpc",
            "containerDefinitions": [
              {
                "name": "${{ env.CONTAINER_NAME }}",
                "image": "IMAGE_PLACEHOLDER",
                "essential": true,
                "portMappings": [{ "containerPort": 8080, "hostPort": 8080 }],
                "environment": [
                  { "name": "SPRING_DOCKER_COMPOSE_ENABLED", "value": "${{ vars.SPRING_DOCKER_COMPOSE_ENABLED }}" },
                  { "name": "SPRING_DATASOURCE_URL", "value": "${{ vars.SPRING_DATASOURCE_URL }}" },
                  { "name": "SPRING_DATASOURCE_USERNAME", "value": "${{ secrets.DB_USERNAME }}" },
                  { "name": "SPRING_DATASOURCE_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}" }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/${{ env.ECR_REPOSITORY }}",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512"
          }
          TASK

      - name: Render Amazon ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/taskdef.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push-image.outputs.image }}

      - name: Deploy to Amazon ECS (Fargate)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Collect CloudWatch logs
        run: |
          mkdir -p logs
          aws logs filter-log-events --log-group-name /ecs/${{ env.ECR_REPOSITORY }} --limit 500 --region ${{ env.AWS_REGION }} --query "events[].message" --output text > logs/ecs-deploy-logs.txt || true
          echo "Saved logs to logs/ecs-deploy-logs.txt"

      - name: Upload CloudWatch logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecs-deploy-logs
          path: logs/ecs-deploy-logs.txt

      - name: Log Docker image info
        run: docker images | grep sandox || true
