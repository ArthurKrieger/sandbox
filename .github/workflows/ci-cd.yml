name: CI/CD - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  CONTAINER_NAME: sandox

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AWS
    steps:
      - name: Checkout code
        run: |
          set -e
          echo "Cloning repository using GITHUB_TOKEN"
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch --depth=1 origin ${{ github.ref }}
          git checkout -f ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build -x test

      - name: Upload JAR artifact (to S3 if configured)
        run: |
          set -e
          if [ -n "${{ vars.S3_ARTIFACT_BUCKET }}" ]; then
            echo "Uploading jar to s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/"
            aws s3 cp build/libs/sandox-*.jar s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/ --region ${{ vars.AWS_REGION }} || true
          else
            echo "S3_ARTIFACT_BUCKET not set; skipping artifact upload."
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build, tag and push Docker image to ECR
        id: push-image
        run: |
          set -e
          REPO=${{ env.ECR_REPOSITORY }}
          IMAGE_TAG=${{ github.sha }}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${REPO}:${IMAGE_TAG}
          aws ecr describe-repositories --repository-names ${REPO} >/dev/null 2>&1 || aws ecr create-repository --repository-name ${REPO} >/dev/null
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          docker build -t ${REPO}:${IMAGE_TAG} .
          docker tag ${REPO}:${IMAGE_TAG} ${ECR_URI}
          docker push ${ECR_URI}
          echo "image=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Create ECS task definition file
        run: |
          mkdir -p ecs
          cat > ecs/taskdef.json <<'TASK'
          {
            "family": "${{ env.ECR_REPOSITORY }}",
            "executionRoleArn": "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}",
            "networkMode": "awsvpc",
            "containerDefinitions": [
              {
                "name": "${{ env.CONTAINER_NAME }}",
                "image": "IMAGE_PLACEHOLDER",
                "essential": true,
                "portMappings": [{ "containerPort": 8080, "hostPort": 8080 }],
                "environment": [
                  { "name": "SPRING_DOCKER_COMPOSE_ENABLED", "value": "${{ vars.SPRING_DOCKER_COMPOSE_ENABLED }}" },
                  { "name": "SPRING_DATASOURCE_URL", "value": "${{ vars.SPRING_DATASOURCE_URL }}" },
                  { "name": "SPRING_DATASOURCE_USERNAME", "value": "${{ secrets.DB_USERNAME }}" },
                  { "name": "SPRING_DATASOURCE_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}" }
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/${{ env.ECR_REPOSITORY }}",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512"
          }
          TASK

      - name: Register task definition and deploy via AWS CLI
        id: deploy-cli
        run: |
          set -e
          IMAGE=${{ steps.push-image.outputs.image }}
          # replace placeholder with actual image
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" ecs/taskdef.json
          # register task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://ecs/taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=${TASK_DEF_ARN}" >> $GITHUB_OUTPUT
          # update service to use new task definition
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE }} --task-definition ${TASK_DEF_ARN} --force-new-deployment
          # wait for service stability
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }}

      - name: Collect CloudWatch logs
        run: |
          mkdir -p logs
          aws logs filter-log-events --log-group-name /ecs/${{ env.ECR_REPOSITORY }} --limit 500 --region ${{ env.AWS_REGION }} --query "events[].message" --output text > logs/ecs-deploy-logs.txt || true
          echo "Saved logs to logs/ecs-deploy-logs.txt"

      - name: Upload CloudWatch logs (to S3 if configured)
        run: |
          set -e
          if [ -n "${{ vars.S3_ARTIFACT_BUCKET }}" ]; then
            aws s3 cp logs/ecs-deploy-logs.txt s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/ecs-deploy-logs.txt --region ${{ vars.AWS_REGION }} || true
            echo "Uploaded logs to s3://${{ vars.S3_ARTIFACT_BUCKET }}/$GITHUB_RUN_ID/ecs-deploy-logs.txt"
          else
            echo "S3_ARTIFACT_BUCKET not set; skipping log upload."
          fi

      - name: Log Docker image info
        run: docker images | grep sandox || true
