name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

env:
  CONTAINER_NAME: sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AWS
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # sandbox-infra's Terraform stores the whole .env as vars.DOTENV. Gradle reads the file;
      # the later shell steps read the same values from $GITHUB_ENV.
      - name: Write .env
        env:
          DOTENV: ${{ vars.DOTENV }}
        run: |
          if [ -z "$DOTENV" ]; then
            echo "::error::Missing vars.DOTENV: run 'terraform apply' in sandbox-infra/environments/sandbox, then re-run this workflow."
            exit 1
          fi
          printf '%s\n' "$DOTENV" > .env
          cat .env >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # Must run before Gradle: dependencies resolve from the S3 Maven repo.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and test
        run: ./gradlew build

      - name: Build, tag and push Docker image to ECR
        if: github.event_name != 'pull_request'
        id: push-image
        run: |
          set -e
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          IMAGE=${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}
          aws ecr get-login-password | docker login --username AWS --password-stdin ${REGISTRY}
          docker build -t ${IMAGE} .
          docker push ${IMAGE}
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Register task definition and update service
        if: github.event_name != 'pull_request'
        run: |
          set -e
          # Terraform owns the task definition; CI only swaps the image.
          aws ecs describe-task-definition --task-definition ${ECR_REPOSITORY} --query 'taskDefinition' > current-taskdef.json

          jq --arg IMAGE "${{ steps.push-image.outputs.image }}" --arg NAME "${CONTAINER_NAME}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' current-taskdef.json > new-taskdef.json

          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster ${ECS_CLUSTER} --service ${ECS_SERVICE} --task-definition ${TASK_DEF_ARN} --force-new-deployment

      - name: Wait for deployment to stabilize
        if: github.event_name != 'pull_request'
        run: aws ecs wait services-stable --cluster ${ECS_CLUSTER} --services ${ECS_SERVICE}
