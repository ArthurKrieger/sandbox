name: CI/CD - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  CONTAINER_NAME: sandox

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AWS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build application
        run: ./gradlew build -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandox-app
          path: build/libs/sandox-*.jar
          retention-days: 7

      - name: Debug — show repo vars and secret presence (SAFE)
        run: |
          echo "ECR_REPOSITORY=${{ vars.ECR_REPOSITORY }}"
          echo "ECS_CLUSTER=${{ vars.ECS_CLUSTER }}"
          echo "ECS_SERVICE=${{ vars.ECS_SERVICE }}"
          echo "AWS_REGION=${{ vars.AWS_REGION }}"
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "AWS_ACCESS_KEY_ID: MISSING"; else echo "AWS_ACCESS_KEY_ID: PRESENT"; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "AWS_SECRET_ACCESS_KEY: MISSING"; else echo "AWS_SECRET_ACCESS_KEY: PRESENT"; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: AWS debug — identity and clusters (SAFE)
        run: |
          echo "--- AWS caller identity ---"
          aws sts get-caller-identity || true
          echo "--- ECS clusters (region: $AWS_REGION) ---"
          aws ecs list-clusters --region "$AWS_REGION" || true
          echo "--- Describe cluster $ECS_CLUSTER ---"
          aws ecs describe-clusters --clusters "$ECS_CLUSTER" --region "$AWS_REGION" || true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag and push Docker image to ECR
        id: push-image
        run: |
          REPO=${{ env.ECR_REPOSITORY }}
          IMAGE_TAG=${{ github.sha }}
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URI=${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${REPO}:${IMAGE_TAG}
          aws ecr describe-repositories --repository-names ${REPO} >/dev/null 2>&1 || aws ecr create-repository --repository-name ${REPO} >/dev/null
          docker build -t ${REPO}:${IMAGE_TAG} .
          docker tag ${REPO}:${IMAGE_TAG} ${ECR_URI}
          docker push ${ECR_URI}
          echo "image=${ECR_URI}" >> $GITHUB_OUTPUT

      - name: Create ECS task definition file
        run: |
          mkdir -p ecs
          cat > ecs/taskdef.json <<'TASK'
          {
            "family": "${{ env.ECR_REPOSITORY }}",
            "executionRoleArn": "${{ secrets.ECS_TASK_EXECUTION_ROLE_ARN }}",
            "networkMode": "awsvpc",
            "containerDefinitions": [
              {
                "name": "${{ env.CONTAINER_NAME }}",
                "image": "IMAGE_PLACEHOLDER",
                "essential": true,
                "portMappings": [{ "containerPort": 8080, "hostPort": 8080 }],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/${{ env.ECR_REPOSITORY }}",
                    "awslogs-region": "${{ env.AWS_REGION }}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ],
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512"
          }
          TASK

      - name: Render Amazon ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/taskdef.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push-image.outputs.image }}

      - name: Deploy to Amazon ECS (Fargate)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Log Docker image info
        run: docker images | grep sandox || true
