name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: {}

env:
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  MAVEN_S3_BUCKET: ${{ vars.MAVEN_S3_BUCKET }}
  CONTAINER_NAME: sandbox

jobs:
  build:
    runs-on: ubuntu-latest
    environment: AWS
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS infra is deployed
        run: |
          ok=true
          check() {
            if [ -z "$2" ]; then
              echo "::error::Missing vars.$1"
              ok=false
            fi
          }
          check AWS_REGION "${{ vars.AWS_REGION }}"
          check AWS_DEPLOY_ROLE_ARN "${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          check MAVEN_S3_BUCKET "${{ vars.MAVEN_S3_BUCKET }}"
          check ECR_REPOSITORY "${{ vars.ECR_REPOSITORY }}"
          check ECS_CLUSTER "${{ vars.ECS_CLUSTER }}"
          check ECS_SERVICE "${{ vars.ECS_SERVICE }}"
          if [ "$ok" = false ]; then
            echo "The AWS environment values are missing: run 'terraform apply' in sandbox-infra/environments/sandbox, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # Must run before Gradle: dependencies resolve from the S3 Maven repo.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and test
        run: ./gradlew build

      - name: Build, tag and push Docker image to ECR
        if: github.event_name != 'pull_request'
        id: push-image
        run: |
          set -e
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          IMAGE=${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}
          aws ecr get-login-password | docker login --username AWS --password-stdin ${REGISTRY}
          docker build -t ${IMAGE} .
          docker push ${IMAGE}
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

      - name: Register task definition and update service
        if: github.event_name != 'pull_request'
        run: |
          set -e
          # Terraform owns the task definition; CI only swaps the image.
          aws ecs describe-task-definition --task-definition ${ECR_REPOSITORY} --query 'taskDefinition' > current-taskdef.json

          jq --arg IMAGE "${{ steps.push-image.outputs.image }}" --arg NAME "${CONTAINER_NAME}" '
            .containerDefinitions = (.containerDefinitions | map(if .name == $NAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' current-taskdef.json > new-taskdef.json

          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-taskdef.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster ${ECS_CLUSTER} --service ${ECS_SERVICE} --task-definition ${TASK_DEF_ARN} --force-new-deployment

      - name: Wait for deployment to stabilize
        if: github.event_name != 'pull_request'
        run: aws ecs wait services-stable --cluster ${ECS_CLUSTER} --services ${ECS_SERVICE}
